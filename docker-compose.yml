services:
  db:
    image: pgvector/pgvector:pg16
    container_name: health_os_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-health}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-health_os}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"   # localhost only
    volumes:
      - ./data/pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-health} -d ${POSTGRES_DB:-health_os}"]
      interval: 10s
      timeout: 5s
      retries: 5

  open-webui:
    image: ghcr.io/open-webui/open-webui:main
    container_name: health_os_webui
    restart: "no"
    ports:
      - "127.0.0.1:3000:8080"   # localhost only: WEBUI_AUTH=false means no login
    environment:
      - OLLAMA_BASE_URL=http://host.docker.internal:11434
      - WEBUI_AUTH=false
    volumes:
      - ./data/webui:/app/backend/data
    extra_hosts:
      - "host.docker.internal:host-gateway"
